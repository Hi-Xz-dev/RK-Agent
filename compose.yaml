name: rk-agent

services:
  ollama:
    image: alpine/ollama:latest@sha256:43fbee7c237a8b32a9226ea80619ef21963688f53266cb7d017ccb73c62d145c
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.17.1
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/6333
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 3s
      retries: 12

  agent: &agent
    image: golang:1.26.11-alpine
    working_dir: /workspace
    entrypoint: ["go", "run", "."]
    environment:
      RK_OLLAMA_URL: http://ollama:11434
      RK_MODEL: "${RK_MODEL:-qwen3:4b}"
      RK_THINK: "${RK_THINK:-false}"
      RK_EMBED_URL: http://ollama:11434/api/embed
      RK_QDRANT_URL: http://qdrant:6333
      GOCACHE: /go-build-cache
    volumes:
      - .:/workspace:ro
      - go-build-cache:/go-build-cache
      - go-mod-cache:/go/pkg/mod
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  web:
    <<: *agent
    command: ["--serve"]
    ports:
      - "${RK_WEB_BIND:-127.0.0.1}:${RK_WEB_PORT:-8090}:8080"

volumes:
  ollama-models:
  go-build-cache:
  qdrant-data:
  go-mod-cache:
